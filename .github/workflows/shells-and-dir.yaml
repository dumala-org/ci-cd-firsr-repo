name: working dir and shells
on: [push]
defaults:
  run:
    shell: bash
    # working-directory:  
jobs:
  display-wd-info:
    runs-on: ubuntu-latest
    steps:
      - name: Display working dir & latest files
        run: |
          pwd
          ls -a
          echo $GITHUB_SHA
          echo $GITHUB_REPOSITORY
          echo $GITHUB_WORKSPACE

  display-wd-info-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Display working dir & latest files
        run: |
          Get-Location
          dir
          echo $GITHUB_SHA
          echo $GITHUB_REPOSITORY
          echo $GITHUB_WORKSPACE
                    